<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: blanchedalmond; color:black; font-size:20px;">
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>

<script>
    // adding new element inside HTML page or elements
function addLanguage(langname) {
    const li = document.createElement('li')
    li.innerHTML = `${langname}`
    document.querySelector('.language').appendChild(li)
}
addLanguage("python")
addLanguage("typescript")

function addOptiLang(langname) {
    const li = document.createElement('li')
    li.appendChild(document.createTextNode(langname)) //Optimize way to add text into element
    document.querySelector('.language').appendChild(li)

}
addLanguage("Golang")

//Edit - we can change value of element with innerHTML,outerHTML,replaceWith property

const secondLang = document.querySelector("li:nth-child(2)")
//secondLang.innerHTML = "Mojo"

const newLi = document.createElement('li')
newLi.textContent = "Mojo"
secondLang.replaceWith(newLi)

//Edit 

const firstLang = document.querySelector("li:first-child")
firstLang.outerHTML = '<li>TypeScript</li>'   

//Remove  - It will remove value or element

const lastLang = document.querySelector('li:last-child')
lastLang.remove()
</script>

</html>
