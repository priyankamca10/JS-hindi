<!-- Creation of new element in DOM -->
 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: black; color:azure">
    
</body>
<script>
    const div = document.createElement('div')
    console.log(div);
    div.className = "myclass"
    // div.id = "myid"
    div.id = Math.round(Math.random()*10 +1)

    div.setAttribute("title","generated title") //setting attributes of elements
    div.style.backgroundColor = "green"
    div.style.padding = "12px"
    // div.innerText = "div Text" //it is overwriting method
    const addText = document.createTextNode("Div Text")
    div.appendChild(addText)

    document.body.appendChild(div)
</script>
</html>
